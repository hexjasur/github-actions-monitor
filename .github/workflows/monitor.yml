name: GitHub Actions Workflow Monitor

on:
  schedule:
    # Har 15 daqiqada bir marta avtomatik tekshiradi
    - cron: '*/15 * * * *'
  # GitHub panelidan qo'lda "Run workflow" bosib tekshirish imkoniyati
  workflow_dispatch:

jobs:
  monitor:
    name: Check All Repos Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Reponi yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Cache holatini yuklash (takroriy xabarlarni oldini olish uchun)
        uses: actions/cache@v4
        with:
          path: last_seen_runs.json
          key: workflow-runs-state-${{ github.run_id }}
          restore-keys: |
            workflow-runs-state-

      - name: Agentni ishga tushirish
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFY_ON_SUCCESS: ${{ vars.NOTIFY_ON_SUCCESS || 'false' }}
